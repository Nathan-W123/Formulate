[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulate"
version = "0.1.0"
description = "Behavior-driven inverse materials design: map desired material behavior to candidate molecules, polymers, blends and formulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.6",
    "pint>=0.23",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Chemistry backends. Kept optional so that `formulate.core`, `formulate.ranking`
# and `formulate.targets` stay importable (and testable) in a bare environment.
chem = ["rdkit>=2023.9", "thermo>=0.2", "pyyaml>=6.0"]

# Physics validation (specification sections 6 and 7). Every one of these is
# an established package integrated rather than reimplemented, per section 13.
# `formulate physics` reports which of them are actually usable, since an
# import that succeeds does not mean a backend that works on the system you
# want - periodic support in particular varies between methods of one package.
physics = ["pyscf>=2.3", "ase>=3.22", "xtb>=22.1"]

# OPLS-AA, a force field fitted to liquids rather than to gas-phase geometries.
# See `formulate.physics.md.opls` for what it buys and where it refuses.
#
# foyer's newest release is from 2021 and its setup.py predates the removal of
# the distutils install_layout option, so pip has to be told to build it with
# the standard-library distutils and without build isolation:
#
#     SETUPTOOLS_USE_DISTUTILS=stdlib pip install --no-build-isolation \
#         'formulate[opls]'
#
# The two OpenMM 8 incompatibilities that remain are shimmed at import time in
# `opls.py`; nothing in the installed package is edited.
opls = ["foyer==0.7.6", "parmed>=4.0", "lark", "networkx", "lxml"]

dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
formulate = "formulate.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formulate = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: runs real molecular dynamics and takes tens of seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
