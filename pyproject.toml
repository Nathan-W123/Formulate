[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formulate"
version = "0.1.0"
description = "Behavior-driven inverse materials design: map desired material behavior to candidate molecules, polymers, blends and formulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "pydantic>=2.6",
    "pint>=0.23",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Chemistry backends. Kept optional so that `formulate.core`, `formulate.ranking`
# and `formulate.targets` stay importable (and testable) in a bare environment.
chem = ["rdkit>=2023.9", "thermo>=0.2"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
formulate = "formulate.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
formulate = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = ["slow: runs real molecular dynamics and takes tens of seconds"]

[tool.ruff]
line-length = 100
target-version = "py310"
